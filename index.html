<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🚂 Railway Builder 2D</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Microsoft YaHei',sans-serif;background:#1a1a2e;color:#eee;overflow:hidden;display:flex;flex-direction:column;height:100vh}
canvas{flex:1;width:100%;cursor:crosshair}

/* 顶部栏 */
.topbar{height:44px;background:#16213e;border-bottom:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;padding:0 16px;gap:12px;z-index:10}
.time{font-family:'Courier New',monospace;font-size:17px;color:#F1C40F;font-weight:bold}
.money{background:linear-gradient(135deg,rgba(39,174,96,0.25),rgba(46,204,113,0.15));border:1px solid rgba(39,174,96,0.4);border-radius:8px;padding:4px 14px;font-family:'Courier New',monospace;font-size:16px;color:#2ECC71;font-weight:bold}
.spd-btns{display:flex;gap:3px}
.spd-btn{padding:4px 10px;background:rgba(52,152,219,0.15);border:1px solid rgba(52,152,219,0.35);border-radius:6px;color:#3498DB;cursor:pointer;font-size:11px}
.spd-btn:hover,.spd-btn.active{background:rgba(52,152,219,0.35)}
.pbtn{padding:4px 10px;background:rgba(243,156,18,0.15);border:1px solid rgba(243,156,18,0.35);border-radius:6px;color:#F39C12;cursor:pointer;font-size:11px}

/* 工具栏 */
.toolbar{position:fixed;top:54px;left:8px;width:155px;background:#16213e;border:1px solid rgba(52,152,219,0.25);border-radius:10px;padding:10px;z-index:10}
.ttl{font-size:11px;color:#F1C40F;margin-bottom:7px;font-weight:bold}
.tbtn{width:100%;padding:7px 6px;margin-bottom:4px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:6px;color:#ccc;cursor:pointer;font-size:12px;display:flex;justify-content:space-between;align-items:center;transition:all 0.15s}
.tbtn:hover:not(.on){background:rgba(52,152,219,0.18);transform:translateX(2px)}
.tbtn.on{background:linear-gradient(135deg,rgba(231,76,60,0.32),rgba(230,126,34,0.18));border-color:rgba(231,76,60,0.65);box-shadow:0 0 10px rgba(231,76,60,0.25)}
.ct{font-size:9px;background:rgba(0,0,0,0.3);padding:1px 6px;border-radius:6px;color:#F39C12}
.sep{height:1px;background:rgba(255,255,255,0.07);margin:7px 0}

/* 信息面板 */
.info{position:fixed;top:54px;right:8px;display:flex;flex-direction:column;gap:6px;z-index:10}
.icard{background:#16213e;border:1px solid rgba(52,152,219,0.22);border-radius:8px;padding:8px 10px;min-width:82px}
.ilbl{font-size:8px;color:#7f8c8d;text-transform:uppercase;letter-spacing:1px;margin-bottom:2px}
.ival{font-family:'Courier New',monospace;font-size:17px;font-weight:bold}

/* 底部状态 */
.statusbar{position:fixed;bottom:8px;left:50%;transform:translateX(-50%);background:#16213e;border:1px solid rgba(52,152,219,0.22);border-radius:8px;padding:6px 16px;font-size:11px;z-index:10;display:flex;align-items:center;gap:10px}
.mtag{padding:3px 10px;border-radius:5px;font-weight:bold;font-size:10px}
.mtag-plat{background:rgba(39,174,96,0.22);color:#2ECC71;border:1px solid rgba(39,174,96,0.45)}
.mtag-trk{background:rgba(230,126,34,0.22);color:#F39C12;border:1px solid rgba(230,126,34,0.45)}

/* 调度面板 */
.sched-panel{position:fixed;top:54px;right:8px;background:#16213e;border:1px solid rgba(231,76,60,0.3);border-radius:10px;padding:10px;width:280px;z-index:20;display:none}
.sched-panel.show{display:block}
.shdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.stitle{font-size:13px;font-weight:bold;color:#E74C3C}
.close-btn{width:22px;height:22px;border-radius:50%;border:none;background:rgba(231,76,60,0.2);color:#E74C3C;cursor:pointer;font-size:14px;text-align:center;line-height:22px}
.close-btn:hover{background:rgba(231,76,60,0.4)}

/* 调度表格 */
.sched-table{width:100%;border-collapse:collapse;font-size:11px}
.sched-table th{background:rgba(52,152,219,0.15);color:#3498DB;padding:5px 4px;text-align:left;font-size:9px;text-transform:uppercase;letter-spacing:0.5px;border-bottom:1px solid rgba(52,152,219,0.2)}
.sched-table td{padding:4px;border-bottom:1px solid rgba(255,255,255,0.04);vertical-align:middle}
.sched-row:hover{background:rgba(255,255,255,0.04)}
.train-dir{text-align:center;font-weight:bold;font-size:12px}
.dir-e{color:#E74C3C}
.dir-w{color:#3498DB}
.train-time{font-family:'Courier New',monospace;color:#F1C40F;font-weight:bold}
.train-action select{background:#0f172a;border:1px solid rgba(52,152,219,0.3);border-radius:4px;color:#ddd;padding:2px 4px;font-size:10px;cursor:pointer;width:100%}
.train-action select option{background:#16213e}
.train-status{font-size:9px;padding:1px 5px;border-radius:3px}
.status-run{background:rgba(39,174,96,0.2);color:#2ECC71}
.status-stop{background:rgba(243,156,18,0.2);color:#F39C12}
.status-wait{background:rgba(149,165,166,0.2);color:#95A5A6}

/* 通知 */
.notif{position:fixed;top:55px;left:50%;transform:translateX(-50%) translateY(-12px);background:#16213e;border-left:3px solid #27AE60;border-radius:6px;padding:8px 18px;color:#fff;font-size:12px;z-index:999;opacity:0;transition:all 0.25s;pointer-events:none;text-align:center;max-width:380px}
.notif.show{opacity:1;transform:translateX(-50%) translateY(0)}
.notif.err{border-left-color:#E74C3C}
.notif.info{border-left-color:#3498DB}

.hint{position:fixed;bottom:38px;right:10px;font-size:10px;color:rgba(255,255,255,0.2);text-align:right;line-height:1.6;z-index:9}
</style>
</head>
<body>

<div class="topbar">
    <div class="time" id="timetxt">08:00 第1天</div>
    <div class="spd-btns">
        <button class="spd-btn active" onclick="setSpd(1)">×1</button>
        <button class="spd-btn" onclick="setSpd(2)">×2</button>
        <button class="spd-btn" onclick="setSpd(4)">×4</button>
    </div>
    <button class="pbtn" id="pbtn" onclick="togPause()">⏸ 暂停</button>
    <button class="tbtn" style="width:auto;padding:4px 12px;font-size:11px" onclick="toggleSched()">📋 调度面板</button>
    <div class="money">💰 <span id="moneytxt">¥5,000</span></div>
</div>

<div class="toolbar">
    <div class="ttl">🔧 建造工具</div>
    <button class="tbtn on" id="bplat" onclick="setTool('plat')"><span>🚉 建造站台</span><span class="ct">¥800</span></button>
    <button class="tbtn" id="btrk" onclick="setTool('trk')"><span>🛤️ 铺设轨道</span><span class="ct">¥50/格</span></button>
    <button class="tbtn" id="bdel" onclick="setTool('del')"><span>🗑️ 删除</span><span style="color:#e74c3c;font-size:9px">返50%</span></button>
    <div class="sep"></div>
    <div class="ttl">🎮 其他</div>
    <button class="tbtn" id="bview" onclick="setTool('view')"><span>👁️ 观看模式</span></button>
    <button class="tbtn" onclick="addTrain()"><span>🚂 发送列车</span><span style="color:#3498db;font-size:9px">免费</span></button>
</div>

<div class="info">
    <div class="icard"><div class="ilbl">🚉 站台</div><div class="ival" id="nplat" style="color:#3498DB">0</div></div>
    <div class="icard"><div class="ilbl">🛤️ 轨道</div><div class="ival" id="ntrk" style="color:#E67E22">0格</div></div>
    <div class="icard"><div class="ilbl">🚂 列车</div><div class="ival" id="ntrain" style="color:#E74C3C">0</div></div>
    <div class="icard"><div class="ilbl">💵 收入/分</div><div class="ival" id="income" style="color:#27AE60">¥0</div></div>
</div>

<!-- 调度面板 -->
<div class="sched-panel" id="schedPanel">
    <div class="shdr">
        <span class="stitle">📋 列车调度表</span>
        <button class="close-btn" onclick="toggleSched()">✕</button>
    </div>
    <table class="sched-table" id="schedTable">
        <thead><tr><th>#</th><th>方向</th><th>状态</th><th>操作</th></tr></thead>
        <tbody id="schedBody"></tbody>
    </table>
    <div style="margin-top:8px;font-size:10px;color:#95A5A6;text-align:center">点击操作列选择停靠方式</div>
</div>

<div class="statusbar">
    <span class="mtag mtag-plat" id="mtag">🏗️ 建造站台</span>
    <span id="mdesc">点击空地建造站台</span>
</div>

<div class="hint">
    🖱️ 左键操作 | 🔄 滚轮缩放 | ⌨️ WASD移动<br>
    🎯 建轨道时按住左键拖拽绘制曲线
</div>

<div id="notifbox"></div>
<canvas id="cv"></canvas>

<script>
// ========== 配置 ==========
const C = {
    GRID: 8,
    MAP_W: 140, MAP_H: 90,
    ENTRY_L: {x:-30, z:40, label:'← 西'},
    ENTRY_R: {x:C.MAP_W*C.GRID+30, z:40, label:'东 →'},
    COST_PLAT: 800,
    COST_TRK: 50,
    MONEY: 5000,
    
    // 颜色
    BG: '#2d4a3d',
    GRID_LINE: 'rgba(80,120,90,0.35)',
    BORDER: '#E67E22',
    PLAT_BODY: '#95A5A6',
    PLAT_ROOF: '#BDC3C7',
    PLAT_LINE: '#F39C12',
    TRACK_BED: '#8B7355',
    TRACK_RAIL: '#666666',
    TIE: '#5D4037',
    TRAIN_COLORS: ['#27AE60','#3498DB','#E74C3C','#F39C12'],
};

const S = {
    tool: 'plat',
    money: C.MONEY,
    spd: 1,
    paused: false,
    timeMin: 480,
    day: 1,
    
    plats: [],
    tracks: [],
    trains: [],
    
    drawing: false,
    drawPts: [],
    
    // 视图偏移和缩放
    offsetX: 0,
    offsetY: 0,
    zoom: 1,
    draggingView: false,
    dragStart: {x:0,y:0},
    
    nextId: { plat:1, track:1, train:1 }
};

let cv, ctx;
let lastTime = 0;

// ========== 工具函数 ==========
function clamp(a,b,c){return Math.max(b,Math.min(c,a))}
function pad(n){return String(Math.floor(n)).padStart(2,'0')}
function fmtMoney(n){
    if(Math.abs(n)>=10000) return '¥'+(n/10000).toFixed(1)+'万';
    return '¥'+Math.floor(n).toLocaleString();
}
function toHHMM(m){return pad(Math.floor(m)/60%24)+':'+pad(m%60)}
function dist(a,b){return Math.sqrt((a.x-b.x)**2+(a.y-b.y)**2)}

function notify(msg,type='ok'){
    const b=document.getElementById('notifbox');
    const n=document.createElement('div');
    n.className='notif'+(type==='err'?' err':type==='info'?' info':'');
    n.textContent=msg;
    b.appendChild(n);
    requestAnimationFrame(()=>n.classList.add('show'));
    setTimeout(()=>{n.classList.remove('show');setTimeout(()=>n.remove(),250)},3000);
}

// 坐标转换：屏幕坐标 ↔ 世界坐标
function screenToWorld(sx,sy){
    return {
        x: (sx - cv.width/2) / S.zoom + S.offsetX,
        y: (sy - cv.height/2) / S.zoom + S.offsetY
    };
}
function worldToScreen(wx,wy){
    return {
        x: (wx - S.offsetX) * S.zoom + cv.width/2,
        y: (wy - S.offsetY) * S.zoom + cv.height/2
    };
}

// ========== 绘制函数 ==========
function initCanvas(){
    cv = document.getElementById('cv');
    ctx = cv.getContext('2d');
    resize();
    window.addEventListener('resize', resize);
    
    cv.addEventListener('mousedown', onMouseDown);
    cv.addEventListener('mousemove', onMouseMove);
    cv.addEventListener('mouseup', onMouseUp);
    cv.addEventListener('wheel', onWheel, {passive:false});
    cv.addEventListener('contextmenu', e => e.preventDefault());
    
    document.addEventListener('keydown', onKeyDown);
    
    // 居中视图
    S.offsetX = C.MAP_W * C.GRID / 2;
    S.offsetY = C.MAP_H * C.GRID / 2;
}

function resize(){
    const r = cv.parentElement.getBoundingClientRect();
    cv.width = r.width;
    cv.height = r.height;
}

function draw(){
    ctx.clearRect(0,0,cv.width,cv.height);
    ctx.save();
    
    // 应用视图变换
    ctx.translate(cv.width/2, cv.height/2);
    ctx.scale(S.zoom, S.zoom);
    ctx.translate(-S.offsetX, -S.offsetY);
    
    drawGround();
    drawEntries();
    drawTracks();
    drawPlats();
    drawTrains();
    if(S.drawing && S.drawPts.length > 0) drawPreviewTrack();
    
    ctx.restore();
    
    // UI覆盖层（不受缩放影响）
    if(S.tool === 'plat'){
        const hint = document.getElementById('bighint');
        drawCenterHint('📍 点击空地建造站台', '#27AE60');
    } else if(S.tool === 'trk' && !S.drawing){
        drawCenterHint('↔️ 从入口处按住左键拖拽绘制轨道', '#E67E22');
    }
}

function drawGround(){
    const w = C.MAP_W * C.GRID;
    const h = C.MAP_H * C.GRID;
    
    // 背景
    ctx.fillStyle = C.BG;
    ctx.fillRect(0, 0, w, h);
    
    // 网格线
    ctx.strokeStyle = C.GRID_LINE;
    ctx.lineWidth = 0.5;
    for(let x=0;x<=w;x+=C.GRID){
        ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke();
    }
    for(let y=0;y<=h;y+=C.GRID){
        ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();
    }
    
    // 边框
    ctx.strokeStyle = C.BORDER;
    ctx.lineWidth = 2;
    ctx.strokeRect(0,0,w,h);
}

function drawEntries(){
    [C.ENTRY_L, C.ENTRY_R].forEach((e,i)=>{
        const x = e.x, y = e.z;
        
        // 入口平台
        ctx.fillStyle = i===0 ? '#3498DB' : '#E74C3C';
        ctx.fillRect(x-20,y-8,40,16);
        
        // 标志牌
        ctx.fillStyle = i===0 ? '#2980B9' : '#C0392B';
        ctx.fillRect(x+(i===0?15:-35),y-18,20,14);
        
        // 文字
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 10px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(e.label, x+(i===0?25:-25), y-11);
        
        // 预置轨道段
        for(let j=0;j<3;j++){
            const rx = x + (i===0 ? 28+j*12 : -28-j*12);
            ctx.fillStyle = C.TRACK_BED;
            ctx.fillRect(rx-5,y-2,10,4);
            ctx.fillStyle = C.TRACK_RAIL;
            ctx.fillRect(rx-5,y-3.5,10,1.2);
            ctx.fillRect(rx-5,y+2.3,10,1.2);
        }
    });
}

function drawPlats(){
    S.plats.forEach(p=>{
        const x = p.x, y = p.y;
        const w = 48, d = 14;
        
        // 站台主体
        ctx.fillStyle = C.PLAT_BODY;
        ctx.fillRect(x-w/2,y-d/2,w,d);
        
        // 顶棚
        ctx.fillStyle = C.PLAT_ROOF;
        ctx.globalAlpha = 0.85;
        ctx.fillRect(x-w/2-2,y-d/2-5,w+4,5);
        ctx.globalAlpha = 1;
        
        // 安全黄线
        ctx.fillStyle = C.PLAT_LINE;
        ctx.fillRect(x-w/2+3,y+d/2-2,w-6,2);
        
        // 编号牌
        ctx.fillStyle = '#1a1a2e';
        ctx.fillRect(x+w/2-16,y-d/2-12,32,10);
        ctx.fillStyle = '#F1C40F';
        ctx.font = 'bold 9px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(p.id+'号站台',x+w/2-0.5,y-d/2-7);
        
        // 站名标签（上方）
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.beginPath();
        ctx.roundRect(x-20,y-d/2-26,40,14,4);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = '10px sans-serif';
        ctx.fillText('🚉 站台',x,y-d/2-19);
    });
}

function drawTracks(){
    S.tracks.forEach(t=>{
        if(t.pts.length < 2) return;
        
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        
        for(let i=0;i<t.pts.length-1;i++){
            const p1=t.pts[i],p2=t.pts[i+1];
            const ang = Math.atan2(p2.y-p1.y,p2.x-p1.x);
            
            // 道床
            ctx.save();
            ctx.translate((p1.x+p2.x)/2,(p1.y+p2.y)/2);
            ctx.rotate(ang);
            const len = dist(p1,p2);
            ctx.fillStyle = C.TRACK_BED;
            ctx.fillRect(-len/2,-3,len,6);
            
            // 双轨
            ctx.fillStyle = C.TRACK_RAIL;
            ctx.fillRect(-len/2,-1.8,len,1);
            ctx.fillRect(-len/2,+0.8,len,1);
            
            // 枕木
            ctx.fillStyle = C.TIE;
            const cnt = Math.max(2,Math.floor(len/4));
            for(let j=0;j<=cnt;j++){
                const t=j/cnt;
                ctx.fillRect(-len/2+len*t-0.8,-2.8,1.6,5.6);
            }
            ctx.restore();
        }
    });
}

function drawPreviewTrack(){
    if(S.drawPts.length < 2) return;
    
    ctx.setLineDash([6,4]);
    ctx.strokeStyle = '#F39C12';
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(S.drawPts[0].x,S.drawPts[0].y);
    for(let i=1;i<S.drawPts.length;i++)ctx.lineTo(S.drawPts[i].x,S.drawPts[i].y);
    ctx.stroke();
    ctx.setLineDash([]);
    
    // 起点标记
    ctx.fillStyle = '#27AE60';
    ctx.beginPath();ctx.arc(S.drawPts[0].x,S.drawPts[0].y,5,0,Math.PI*2);ctx.fill();
}

function drawTrains(){
    S.trains.forEach(t=>{
        if(!t.path||t.path.length<2)return;
        
        // 计算当前位置
        let idx = t.idx;
        let prog = t.prog;
        if(idx >= t.path.length-1) return;
        
        const p1 = t.path[idx];
        const p2 = t.path[Math.min(idx+1,t.path.length-1)];
        const x = p1.x+(p2.x-p1.x)*prog;
        const y = p1.y+(p2.y-p1.y)*prog;
        const ang = Math.atan2(p2.y-p1.y,p2.x-p1.x)+(t.dir==='E'?0:Math.PI);
        
        ctx.save();
        ctx.translate(x,y);
        ctx.rotate(ang);
        
        // 列车车身
        const col = C.TRAIN_COLORS[t.type] || C.TRAIN_COLORS[0];
        ctx.fillStyle = col;
        ctx.fillRect(-18,-3.5,36,7);
        
        // 车头
        ctx.beginPath();
        ctx.moveTo(18,0);
        ctx.lineTo(12,-3.5);
        ctx.lineTo(12,3.5);
        ctx.closePath();
        ctx.fill();
        
        // 车窗
        ctx.fillStyle = 'rgba(173,216,230,0.6)';
        for(let i=0;i<t.cars;i++){
            ctx.fillRect(-16-i*7,-2,5,4);
        }
        
        // 方向标识
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 8px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(t.dir==='E'?'→':'←',0,-7);
        
        ctx.restore();
    });
}

function drawCenterHint(text,color){
    ctx.save();
    ctx.fillStyle = color;
    ctx.globalAlpha = 0.15;
    ctx.font = 'bold 28px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(text,cv.width/2,cv.height/2);
    ctx.restore();
}

// ========== 建造系统 ==========
function buildPlatform(wx,wy){
    if(S.money < C.COST_PLAT){
        notify(`资金不足！需要${fmtMoney(C.COST_PLAT)}`,'err');
        return;
    }
    
    // 检查重叠
    for(const p of S.plats){
        if(dist({x:wx,y:wy},p)<30){
            notify('位置太近已有站台','info');
            return;
        }
    }
    
    S.money -= C.COST_PLAT;
    const plat = {id:S.nextId.plat++,x:wx,y:wy};
    S.plats.push(plat);
    
    updUI();
    notify(`✅ ${plat.id}号站台建成！花费${fmtMoney(C.COST_PLAT)}`,'ok');
    
    if(S.plats.length === 1){
        setTimeout(()=>notify('💡 提示：选择【铺设轨道】从入口画线到站台前','info'),1500);
    }
}

function startDrawTrack(pt){
    if(S.money < C.COST_TRK){notify('资金不足','err');return}
    S.drawing = true;
    S.drawPts = [pt];
    setMDesc('正在绘制轨道...');
}

function moveDrawTrack(pt){
    if(!S.drawing) return;
    S.drawPts.push(pt);
}

function endDrawTrack(pt){
    if(!S.drawing) return;
    S.drawPts.push(pt);
    
    // 计算长度
    let len = 0;
    for(let i=1;i<S.drawPts.length;i++){
        len += dist(S.drawPts[i-1],S.drawPts[i]);
    }
    
    const cells = Math.ceil(len / C.GRID);
    const cost = cells * C.COST_TRK;
    
    if(cost > S.money){
        notify(`资金不足！需要${fmtMoney(cost)}`,'err');
        cancelDraw();
        return;
    }
    
    if(cells < 3){
        notify('轨道太短了！至少需要3格','info');
        cancelDraw();
        return;
    }
    
    S.money -= cost;
    const track = {
        id:S.nextId.track++,
        pts:S.drawPts.map(p=>({x:p.x,y:p.y})),
        cells, cost
    };
    S.tracks.push(track);
    
    cancelDraw();
    updUI();
    notify(`✅ 轨道完成！${cells}格，花费${fmtMoney(cost)}`,'ok');
    
    // 自动发第一列车
    if(S.tracks.length>0 && S.trains.length<2 && S.plats.length>0){
        setTimeout(addTrain,800);
    }
}

function cancelDraw(){
    S.drawing = false;
    S.drawPts = [];
    setMDesc('');
}

function deleteAt(wx,wy){
    // 删除站台
    for(let i=S.plats.length-1;i>=0;i--){
        if(dist({x:wx,y:wy},S.plats[i])<25){
            sceneRemove(S.plats[i]);
            S.plats.splice(i,1);
            S.money += Math.floor(C.COST_PLAT*0.5);
            updUI();notify('站台已删除 +'+fmtMoney(Math.floor(C.COST_PLAT*0.5)),'info');
            return;
        }
    }
    // 删除轨道
    for(let i=S.tracks.length-1;i>=0;i--){
        const mid = getTrackMid(S.tracks[i]);
        if(mid && dist({x:wx,y:wy},mid)<20){
            const ref = Math.floor(S.tracks[i].cells*C.COST_TRK*0.5);
            S.money += ref;
            S.tracks.splice(i,1);
            updUI();notify('轨道已删除 +'+fmtMoney(ref),'info');
            return;
        }
    }
}

function sceneRemove(obj){} // 2D不需要清理DOM

function getTrackMid(trk){
    if(!trk.pts||trk.pts.length<2)return null;
    const midIdx = Math.floor(trk.pts.length/2);
    return trk.pts[midIdx];
}

// ========== 列车系统 ==========
function addTrain(){
    if(S.tracks.length===0){notify('请先铺设轨道！','info');return}
    if(S.trains.length>=20){notify('已达最大列车数','warning');return}
    
    const trk = S.tracks[Math.floor(Math.random()*S.tracks.length)];
    const type = Math.floor(Math.random()*4);
    const cars = [3,4,6,8][type];
    const speed = [1,1.6,2.3,3][type];
    const dir = trk.pts[0].x > trk.pts[trk.pts.length-1].x ? 'W' : 'E';
    
    const train = {
        id:S.nextId.train++,
        path:trk.pts,
        idx:0, prog:0,
        state:'run',
        type,cars,speed,dir,
        action:'pass' // pass|stop|delay5|delay10
    };
    
    S.trains.push(train);
    updUI();
    updateSchedTable();
    
    const names=['普速','快速','动车','高铁'];
    notify(`🚂 ${names[type]}#${String(train.id).padStart(3,'0')} ${dir==='E'?'东→西':'西→东'} 已发车`,'ok');
}

function updateTrains(dt){
    const toRemove = [];
    
    S.trains.forEach(t=>{
        if(!t.path||t.path.length<2)return;
        
        // 处理停靠逻辑
        let spdMult = 1;
        if(t.action === 'stop'){
            // 检查是否在站台附近
            const nearPlat = S.plats.some(p=>dist({x:t.getX(),y:t.getY()},p)<20);
            if(nearPlat && t.prog>0.3&&t.prog<0.7){
                spdMult = 0; // 停靠中
                t.state = 'stop';
                if(!t.stopTimer)t.stopTimer=0;
                t.stopTimer+=dt*60*S.spd;
                if(t.stopTimer>180){t.stopTimer=0;t.action='pass';t.state='run'}
            }else{
                t.state='run';
            }
        } else if(t.action.startsWith('delay')){
            const mins = parseInt(t.action.replace('delay',''))||5;
            // 在某个点等待
            if(t.idx===Math.floor(t.path.length/3)){
                spdMult=0;t.state='wait';
                if(!t.delayTimer)t.delayTimer=0;
                t.delayTimer+=dt*60*S.spd;
                if(t.delayTimer>mins*60){t.delayTimer=0;t.action='pass';t.state='run'}
            }else{
                t.state='run';
            }
        } else {
            t.state='run';
        }
        
        t.prog += 0.008*t.speed*dt*60*S.spd*spdMult;
        
        if(t.prog >= 1){
            t.idx++;
            t.prog = 0;
            if(t.idx >= t.path.length-1){
                toRemove.push(t.id);
            }
        }
    });
    
    toRemove.forEach(id=>{
        const idx = S.trains.findIndex(t=>t.id===id);
        if(idx!==-1){
            S.trains.splice(idx,1);
            if(Math.random()<0.75&&S.tracks.length>0)setTimeout(addTrain,randomInt(2000,5000));
        }
    });
    
    updateSchedTable();
}

// 辅助：获取列车当前世界坐标
Object.defineProperty(Array.prototype,'getX',{value:function(){const t=this[0];if(!t)return 0;let i=t.idx,i2=Math.min(i+1,t.path.length-1),p=t.path[i],p2=t.path[i2];return p.x+(p2.x-p.x)*t.prog}});
Object.defineProperty(Array.prototype,'getY',{value:function(){const t=this[0];if(!t)return 0;let i=t.idx,i2=Math.min(i+1,t.path.length-1),p=t.path[i],p2=t.path[i2];return p.y+(p2.y-p.y)*t.prog}});

// ========== 收入系统 ==========
function calcIncome(){
    const pc = S.plats.length*12 + S.tracks.reduce((s,t)=>s+t.cells,0)*2 + S.trains.filter(t=>t.state!=='wait').length*20;
    const h = Math.floor(S.timeMin%1440/60);
    return pc*(h>=6&&h<20?1.3:0.5);
}

// ========== UI更新 ==========
function updUI(){
    document.getElementById('moneytxt').textContent = fmtMoney(S.money);
    document.getElementById('nplat').textContent = S.plats.length;
    document.getElementById('ntrk').textContent = S.tracks.reduce((s,t)=>s+t.cells,0)+'格';
    document.getElementById('ntrain').textContent = S.trains.length;
    document.getElementById('income').textContent = fmtMoney(calcIncome());
    document.getElementById('timetxt').textContent = `${toHHMM(S.timeMin)} 第${S.day}天`;
}

function setTool(tool){
    S.tool = tool;
    cancelDraw();
    ['bplat','btrk','bdel','bview'].forEach(id=>{
        const b=document.getElementById(id);
        if(b)b.classList.toggle('on',id==='b'+tool);
    });
    
    const tag = document.getElementById('mtag');
    const desc = document.getElementById('mdesc');
    
    switch(tool){
        case'plat':
            tag.className='mtag mtag-plat';tag.textContent='🏗️ 建造站台';
            desc.textContent='点击空地建造 (¥'+C.COST_PLAT+')';
            break;
        case'trk':
            tag.className='mtag mtag-trk';tag.textContent='🛤️ 铺设轨道';
            desc.textContent='从入口处按住左键拖拽绘制 (¥'+C.COST_TRK+'/格)';
            break;
        case'del':
            tag.className='mtag mtag-plat';tag.textContent='🗑️ 删除模式';
            desc.textContent='点击建筑删除';
            break;
        case'view':
            tag.style.cssText='background:rgba(52,152,219,0.22);color:#3498DB;border:1px solid rgba(52,152,219,0.45)';
            tag.textContent='👁️ 观看模式';
            desc.textContent='自由查看';
            break;
    }
}

function setMDesc(d){document.getElementById('mdesc').textContent=d||''}

// ========== 调度面板 ==========
function toggleSched(){
    const p = document.getElementById('schedPanel');
    p.classList.toggle('show');
    if(p.classList.contains('show'))updateSchedTable();
}

function updateSchedTable(){
    const tbody = document.getElementById('schedBody');
    tbody.innerHTML = '';
    
    if(S.trains.length===0){
        tbody.innerHTML='<tr><td colspan="4" style="text-align:center;color:#7f8c8d;padding:20px">暂无列车，点击【发送列车】添加</td></tr>';
        return;
    }
    
    const names = ['普速','快速','动车','高铁'];
    const actions = [
        {v:'pass',label:'🟢 不停靠'},
        {v:'stop',label:'🟡 停靠'},
        {v:'delay5',label:'⏰ 5分钟后停'},
        {v:'delay10',label:'⏰ 10分钟后停'}
    ];
    
    S.trains.forEach(t=>{
        const tr = document.createElement('tr');
        tr.className='sched-row';
        
        const stateClass = t.state==='run'?'status-run':t.state==='stop'?'status-stop':'status-wait';
        const stateText = t.state==='run'?'运行中':t.state==='stop'?'停靠中':'等待中';
        
        tr.innerHTML = `
            <td>#${String(t.id).padStart(3,'0')}</td>
            <td class="train-dir ${t.dir==='E'?'dir-e':'dir-w'}">${t.dir==='E'?'东→西':'西→东'}</td>
            <td><span class="train-status ${stateClass}">${stateText}</span></td>
            <td class="train-action">
                <select onchange="changeAction(${t.id},this.value)">
                    ${actions.map(a=>`<option value="${a.v}"${t.action===a.v?'selected':''}>${a.label}</option>`).join('')}
                </select>
            </td>
        `;
        tbody.appendChild(tr);
    });
}

window.changeAction = function(trainId,action){
    const t = S.trains.find(t=>t.id===trainId);
    if(t){
        t.action = action;
        t.stopTimer = 0;
        t.delayTimer = 0;
        const labels = {'pass':'不停靠','stop':'停靠','delay5':'5分钟后停','delay10':'10分钟后停'};
        notify(`📋 列车#${String(trainId).padStart(3,'0')} → ${labels[action]||action}`,'info');
    }
};

// ========== 事件处理 ==========
function onMouseDown(e){
    if(e.button===2){
        S.draggingView=true;
        S.dragStart={x:e.clientX,y:e.clientY};
        return;
    }
    if(e.button!==0)return;
    
    const wp = screenToWorld(e.clientX,e.clientY);
    
    if(S.tool==='trk'){
        startDrawTrack(wp);
    }
}

function onMouseMove(e){
    if(S.draggingView){
        const dx=(e.clientX-S.dragStart.x)/S.zoom;
        const dy=(e.clientY-S.dragStart.y)/S.zoom;
        S.offsetX-=dx;S.offsetY-=dy;
        S.dragStart={x:e.clientX,y:e.clientY};
        return;
    }
    
    if(S.tool==='trk'&&S.drawing&&e.buttons===1){
        const wp = screenToWorld(e.clientX,e.clientY);
        moveDrawTrack(wp);
    }
}

function onMouseUp(e){
    if(e.button===2){S.draggingView=false;return}
    if(e.button!==0)return;
    
    if(S.tool==='trk'&&S.drawing){
        const wp = screenToWorld(e.clientX,e.clientY);
        endDrawTrack(wp);
        return;
    }
    
    if(S.tool==='plat'||S.tool==='del'){
        const wp = screenToWorld(e.clientX,e.clientY);
        if(wp.x<0||wp.x>C.MAP_W*C.GRID||wp.y<0||wp.y>C.MAP_H*C.GRID)return;
        
        if(S.tool==='plat')buildPlatform(wp.x,wp.y);
        else if(S.tool==='del')deleteAt(wp.x,wp.y);
    }
}

function onWheel(e){
    e.preventDefault();
    const factor = e.deltaY>0?0.92:1.08;
    S.zoom = clamp(S.zoom*factor,0.3,3);
}

function onKeyDown(e){
    const spd = 8/S.zoom;
    switch(e.key.toLowerCase()){
        case'w':S.offsetY-=spd;break;
        case's':S.offsetY+=spd;break;
        case'a':S.offsetX-=spd;break;
        case'd':S.offsetX+=spd;break;
        case' ':togPause();break;
        case'1':setSpd(1);break;
        case'2':setSpd(2);break;
        case'3':setSpd(4);break;
        case'escape':cancelDraw();break;
        case'delete':case'backspace':cancelDraw();break;
    }
}

// ========== 控制 ==========
function setSpd(s){S.spd=s;document.querySelectorAll('.spd-btn').forEach((b,i)=>b.classList.toggle('active',i+1===s))}
function togPause(){S.paused=!S.paused;document.getElementById('pbtn').textContent=S.paused?'▶ 继续':'⏸ 暂停'}
function randomInt(min,max){return Math.floor(Math.random()*(max-min+1))+min}

// ========== 主循环 ==========
function gameLoop(timestamp){
    requestAnimationFrame(gameLoop);
    
    const dt = Math.min((timestamp-lastTime)/1000,0.1)||0.016;
    lastTime = timestamp;
    
    if(!S.paused){
        S.timeMin += dt*60*S.spd;
        while(S.timeMin>=1440){S.timeMin-=1440;S.day++}
        
        updateTrains(dt);
        const inc = calcIncome()*dt*S.spd/60;
        S.money += inc;
        
        if(Math.floor(S.timeMin)%2===0)updUI();
    }
    
    draw();
}

// ========== 启动 ==========
console.log('🚂 Railway Builder 2D v1.0');
try{
    initCanvas();
    updUI();
    gameLoop(0);
    console.log('✅ Ready!');
}catch(e){
    console.error('❌ Error:',e);
    document.body.innerHTML=`<div style="padding:40px;color:#e74c3c;text-align:center;"><h1>⚠️ 加载出错</h1><pre>${e.stack}</pre><br><button onclick="location.reload()"style="padding:10px 20px;cursor:pointer;">🔄 重试</button></div>`;
}

window.setTool=setTool;
window.addTrain=addTrain;
window.setSpd=setSpd;
window.togPause=togPause;

</script>
