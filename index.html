<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚂 Railway Frontier - 火车站建造</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: #1a1a2e;
            color: #eaeaea;
            overflow: hidden;
            user-select: none;
        }
        
        /* ========== 3D画布容器 ========== */
        #canvas-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
        }
        
        /* ========== UI层 ========== */
        #ui-layer {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 10;
        }
        #ui-layer > * { pointer-events: auto; }
        
        /* ========== 顶部信息栏 ========== */
        .top-bar {
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 50px;
            background: linear-gradient(180deg, rgba(26,26,46,0.95), rgba(26,26,46,0.8));
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .time-display {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 16px;
        }
        .time-value {
            font-family: 'Courier New', monospace;
            font-size: 22px;
            font-weight: bold;
            color: #F1C40F;
            text-shadow: 0 0 10px rgba(241,196,15,0.5);
        }
        
        .speed-controls {
            display: flex;
            gap: 8px;
        }
        .speed-btn {
            padding: 6px 14px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 6px;
            color: #ccc;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 13px;
        }
        .speed-btn:hover { background: rgba(255,255,255,0.2); }
        .speed-btn.active {
            background: #3498DB;
            color: white;
            border-color: #3498DB;
        }
        
        /* ========== 右上角数据面板 ========== */
        .data-panel {
            position: absolute;
            top: 60px;
            right: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 200px;
        }
        .data-card {
            background: rgba(22,33,62,0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(52,152,219,0.3);
            border-radius: 12px;
            padding: 12px 16px;
            transition: all 0.3s;
        }
        .data-card:hover {
            border-color: rgba(52,152,219,0.6);
            transform: translateX(-3px);
        }
        .data-label {
            font-size: 11px;
            color: #95a5a6;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .data-value {
            font-family: 'Courier New', monospace;
            font-size: 24px;
            font-weight: bold;
            color: #27AE60;
        }
        .data-card.money .data-value { color: #F1C40F; }
        .data-card.trains .data-value { color: #E74C3C; }
        .data-card.platforms .data-value { color: #3498DB; }
        
        /* ========== 左侧建设面板 ========== */
        .build-panel {
            position: absolute;
            top: 70px;
            left: 15px;
            width: 200px;
            background: rgba(22,33,62,0.92);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(52,152,219,0.25);
            border-radius: 14px;
            padding: 18px;
        }
        .panel-title {
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #F1C40F;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .build-btn {
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            background: linear-gradient(135deg, rgba(39,174,96,0.2), rgba(46,204,113,0.1));
            border: 1px solid rgba(39,174,96,0.4);
            border-radius: 10px;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
        }
        .build-btn:hover:not(.locked):not(:disabled) {
            background: linear-gradient(135deg, rgba(39,174,96,0.35), rgba(46,204,113,0.2));
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(39,174,96,0.3);
        }
        .build-btn.locked {
            opacity: 0.45;
            cursor: not-allowed;
            background: rgba(128,128,128,0.15);
            border-color: rgba(128,128,128,0.3);
        }
        .build-btn.locked:hover {
            transform: none;
            box-shadow: none;
        }
        .build-btn-name { font-weight: 500; }
        .build-btn-cost {
            font-size: 12px;
            padding: 3px 10px;
            background: rgba(0,0,0,0.3);
            border-radius: 12px;
        }
        .build-btn.free .build-btn-cost {
            background: rgba(39,174,96,0.3);
            color: #2ECC71;
            font-weight: bold;
        }
        
        .build-btn.highlight-pulse {
            animation: highlightPulse 1.5s ease-in-out infinite;
            border: 2px solid #27AE60 !important;
            box-shadow: 0 0 20px rgba(39,174,96,0.7) !important;
            background: linear-gradient(135deg, rgba(39,174,96,0.3), rgba(46,204,113,0.2)) !important;
        }
        @keyframes highlightPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.04); box-shadow: 0 0 30px rgba(39,174,96,0.9) !important; }
        }
        
        /* ========== 底部状态栏 ========== */
        .bottom-bar {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(22,33,62,0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(52,152,219,0.3);
            border-radius: 12px;
            padding: 12px 28px;
            display: flex;
            align-items: center;
            gap: 20px;
            font-size: 14px;
        }
        .stage-info {
            color: #F1C40F;
            font-weight: bold;
        }
        .progress-container {
            flex: 1;
            max-width: 300px;
        }
        .progress-bar-bg {
            height: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #27AE60, #2ECC71, #F1C40F);
            border-radius: 4px;
            transition: width 0.5s ease;
            background-size: 200% 100%;
            animation: progressShine 2s linear infinite;
        }
        @keyframes progressShine {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        
        /* ========== 提示文字 ========== */
        .hint-text {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.5);
            font-size: 13px;
            text-align: center;
            line-height: 1.6;
        }
        
        /* ========== 通知弹窗 ========== */
        .notification {
            position: fixed;
            top: 70px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: rgba(22,33,62,0.97);
            backdrop-filter: blur(15px);
            border-left: 4px solid #27AE60;
            border-radius: 10px;
            padding: 14px 24px;
            color: #fff;
            font-size: 14px;
            z-index: 1000;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.68,-0.55,0.265,1.55);
            pointer-events: none;
            max-width: 450px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }
        .notification.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .notification.error { border-left-color: #E74C3C; }
        .notification.warning { border-left-color: #F39C12; }
        .notification.info { border-left-color: #3498DB; }
        
        /* ========== 引导弹窗 ========== */
        .tutorial-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(8px);
            z-index: 999;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .tutorial-box {
            background: linear-gradient(135deg, #16213e, #1a1a2e);
            border: 2px solid rgba(52,152,219,0.4);
            border-radius: 20px;
            padding: 35px 45px;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6), 0 0 100px rgba(52,152,219,0.1);
            animation: slideUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .tutorial-title {
            font-size: 28px;
            margin-bottom: 10px;
            color: #F1C40F;
        }
        .tutorial-subtitle {
            font-size: 15px;
            color: #95a5a6;
            margin-bottom: 25px;
        }
        .tutorial-step {
            background: rgba(39,174,96,0.15);
            border: 1px solid rgba(39,174,96,0.3);
            border-radius: 12px;
            padding: 18px;
            margin: 15px 0;
            text-align: left;
        }
        .tutorial-step-title {
            color: #2ECC71;
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 8px;
        }
        .tutorial-step-desc {
            color: #bdc3c7;
            font-size: 13px;
            line-height: 1.6;
        }
        .tutorial-btn {
            margin-top: 25px;
            padding: 14px 40px;
            background: linear-gradient(135deg, #27AE60, #2ECC71);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 20px rgba(39,174,96,0.4);
        }
        .tutorial-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(39,174,96,0.6);
        }
        
        /* ========== 操作提示 ========== */
        .controls-hint {
            position: absolute;
            bottom: 15px;
            right: 15px;
            font-size: 11px;
            color: rgba(255,255,255,0.3);
            text-align: right;
            line-height: 1.8;
        }
    </style>
</head>
<body>
    
    <!-- 3D画布容器 -->
    <div id="canvas-container"></div>
    
    <!-- UI层 -->
    <div id="ui-layer">
        
        <!-- 顶部栏 -->
        <div class="top-bar">
            <div class="time-display">
                <span>🕐</span>
                <span class="time-value" id="time-display">08:00</span>
                <span style="color:#95a5a6;font-size:13px;" id="day-display">第1天</span>
            </div>
            
            <div class="speed-controls">
                <button class="speed-btn active" onclick="setSpeed(1)">×1</button>
                <button class="speed-btn" onclick="setSpeed(2)">×2</button>
                <button class="speed-btn" onclick="setSpeed(4)">×4</button>
                <button class="speed-btn" onclick="togglePause()" id="pause-btn">⏸ 暂停</button>
            </div>
        </div>
        
        <!-- 右上角数据面板 -->
        <div class="data-panel">
            <div class="data-card money">
                <div class="data-label">💰 资金</div>
                <div class="data-value" id="val-money">¥2,000</div>
            </div>
            <div class="data-card trains">
                <div class="data-label">🚂 运营列车</div>
                <div class="data-value" id="val-trains">0 列</div>
            </div>
            <div class="data-card platforms">
                <div class="data-label">🚉 已建站台</div>
                <div class="data-value" id="val-platforms">0 / 8</div>
            </div>
        </div>
        
        <!-- 左侧建设面板 -->
        <div class="build-panel">
            <div class="panel-title">🏗️ 站台建造</div>
            
            <!-- 动态生成的站台按钮将插入这里 -->
            <div id="platform-buttons"></div>
            
            <div style="margin-top:15px;padding-top:15px;border-top:1px solid rgba(255,255,255,0.1);">
                <div class="panel-title">🚆 自动发车</div>
                <button class="build-btn" onclick="addAutoTrain()" id="btn-add-train">
                    <span class="build-btn-name">➕ 添加列车</span>
                    <span class="build-btn-cost">免费</span>
                </button>
            </div>
        </div>
        
        <!-- 底部状态栏 -->
        <div class="bottom-bar">
            <span class="stage-info" id="stage-text">阶段 1/5 — 小站起步</span>
            <div class="progress-container">
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="stage-progress" style="width: 0%;"></div>
                </div>
            </div>
            <span id="next-stage-hint">下一阶段: ¥5,000</span>
        </div>
        
        <!-- 操作提示 -->
        <div class="controls-hint">
            🖱️ 右键拖拽旋转<br>
            🔄 滚轮缩放<br>
            ⌨️ WASD微调
        </div>
        
        <!-- 通知容器 -->
        <div id="notif-container"></div>
    </div>

    <!-- Three.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    
    <script>
    // ============================================
    // 🔧 Railway Frontier v1.0 - 极简建造版
    // ============================================

    // ==================== 配置常量 ====================
    const CONFIG = {
        TIME_SCALE: 60,              // 1秒现实 = 60游戏分钟
        MAX_PLATFORMS: 8,
        MAX_TRAINS: 20,
        PLATFORM_SPACING: 14,       // 站台间距
        TRACK_LENGTH: 50,           // 轨道长度
        PLATFORM_COST_BASE: 0,      // 第一个站台免费
        TRAIN_INTERVAL_MIN: 3,      // 最短发车间隔（分钟）
        INCOME_PER_PLATFORM: 15,    // 每个站台每分钟基础收入
        INCOME_PER_TRAIN: 25,       // 每列火车每分钟额外收入
    };

    const STAGE_REQUIREMENTS = [
        { stage: 1, name: "小站起步", requiredIncome: 0, unlockPlatforms: 1 },
        { stage: 2, name: "区域车站", requiredIncome: 5000, unlockPlatforms: 2 },
        { stage: 3, name: "市级枢纽", requiredIncome: 20000, unlockPlatforms: 4 },
        { stage: 4, name: "交通中心", requiredIncome: 80000, unlockPlatforms: 6 },
        { stage: 5, name: "超级车站", requiredIncome: 250000, unlockPlatforms: 8 },
    ];

    const TRAIN_TYPES = [
        { type: 'normal', name: '普速列车', color: 0x27AE60, speed: 1.0, carCount: 3, price: 10 },
        { type: 'fast', name: '快速列车', color: 0x3498DB, speed: 1.6, carCount: 4, price: 20 },
        { type: 'bullet', name: '动车组', color: 0xE74C3C, speed: 2.2, carCount: 6, price: 35 },
        { type: 'hsr', name: '高铁', color: 0xECF0F1, speed: 3.0, carCount: 8, price: 50 },
    ];

    // ==================== 游戏状态 ====================
    const GameState = {
        // 基础资源
        money: 2000,
        totalIncome: 0,
        
        // 时间
        timeMinutes: 480,          // 从08:00开始
        day: 1,
        speedMultiplier: 1,
        paused: true,               // 开始时暂停
        
        // 站台
        builtPlatforms: [],         // 已建造的站台ID列表 [1, 2, 3...]
        platformMeshes: {},          // 站台3D模型引用
        trackMeshes: {},             // 轨道3D模型引用
        
        // 列车
        trains: [],                  // 运营中的列车列表
        trainMeshes: {},             // 列车3D模型引用
        nextTrainId: 1,
        
        // 引导状态
        tutorialComplete: false,
        hasBuiltFirstPlatform: false,
        
        // 阶段
        currentStage: 1,
    };

    // Three.js 对象
    let scene, camera, renderer, clock;
    let ambientLight, dirLight;
    
    // 相机控制
    let cameraTheta = Math.PI / 4;
    let cameraPhi = Math.PI / 3.5;
    let cameraDistance = 120;
    let cameraTarget = new THREE.Vector3(0, 0, 0);
    let isDragging = false;
    let lastMouseX = 0, lastMouseY = 0;

    // ==================== 工具函数 ====================
    function clamp(val, min, max) {
        return Math.max(min, Math.min(max, val));
    }

    function padZero(n) {
        return String(Math.floor(n)).padStart(2, '0');
    }

    function formatMoney(n) {
        if (Math.abs(n) >= 10000) {
            return '¥' + (n / 10000).toFixed(1) + '万';
        }
        return '¥' + Math.floor(n).toLocaleString();
    }

    function minutesToHHMM(m) {
        const h = Math.floor(Math.floor(m) / 60) % 24;
        const mi = Math.floor(m) % 60;
        return `${padZero(h)}:${padZero(mi)}`;
    }

    function randomInt(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function showNotification(message, type = 'success') {
        const container = document.getElementById('notif-container');
        const notif = document.createElement('div');
        notif.className = `notification ${type}`;
        notif.textContent = message;
        container.appendChild(notif);
        
        requestAnimationFrame(() => notif.classList.add('show'));
        
        setTimeout(() => {
            notif.classList.remove('show');
            setTimeout(() => notif.remove(), 400);
        }, 3500);
    }

    // ==================== Three.js 场景初始化 ====================
    function initScene() {
        // 创建场景
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);  // 天蓝色

        // 正交相机
        const aspect = window.innerWidth / window.innerHeight;
        const viewSize = 80;
        camera = new THREE.OrthographicCamera(
            -viewSize * aspect, viewSize * aspect,
            viewSize, -viewSize,
            0.1, 1000
        );
        updateCameraPosition();

        // 渲染器
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // 时钟
        clock = new THREE.Clock();

        // 光照
        ambientLight = new THREE.AmbientLight(0xffffff, 0.45);
        scene.add(ambientLight);

        dirLight = new THREE.DirectionalLight(0xfffaf0, 0.75);
        dirLight.position.set(50, 80, 40);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // 地面
        createGround();
        
        // 主站房（装饰性）
        createMainBuilding();

        // 预生成所有站台和轨道模型（初始隐藏）
        for (let i = 1; i <= CONFIG.MAX_PLATFORMS; i++) {
            createPlatformAndTrack(i);
            GameState.platformMeshes[i].visible = false;
            GameState.trackMeshes[i].visible = false;
        }

        // 事件监听
        initOrbitControls();
        window.addEventListener('resize', onWindowResize);
    }

    function createGround() {
        // 地面网格
        const gridHelper = new THREE.GridHelper(250, 25, 0x444444, 0x333333);
        scene.add(gridHelper);

        // 地面平面
        const groundGeo = new THREE.PlaneGeometry(250, 250);
        const groundMat = new THREE.MeshLambertMaterial({ 
            color: 0x2d5a27,
            transparent: true,
            opacity: 0.85
        });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.01;
        ground.receiveShadow = true;
        scene.add(ground);
    }

    function createMainBuilding() {
        const group = new THREE.Group();
        
        // 主体
        const bodyGeo = new THREE.BoxGeometry(20, 12, 15);
        const bodyMat = new THREE.MeshLambertMaterial({ color: 0xecf0f1 });
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.position.y = 6;
        body.castShadow = true;
        group.add(body);

        // 屋顶
        const roofGeo = new THREE.ConeGeometry(15, 5, 4);
        const roofMat = new THREE.MeshLambertMaterial({ color: 0xe74c3c });
        const roof = new THREE.Mesh(roofGeo, roofMat);
        roof.position.y = 14.5;
        roof.rotation.y = Math.PI / 4;
        group.add(roof);

        // 门
        const doorGeo = new THREE.BoxGeometry(4, 6, 0.5);
        const doorMat = new THREE.MeshLambertMaterial({ color: 0x2c3e50 });
        const door = new THREE.Mesh(doorGeo, doorMat);
        door.position.set(0, 3, 7.6);
        group.add(door);

        // 钟
        const clockFace = new THREE.CircleGeometry(1.5, 32);
        const clockMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        const clockMesh = new THREE.Mesh(clockFace, clockMat);
        clockMesh.position.set(0, 9, 7.7);
        group.add(clockMesh);

        group.position.set(-(CONFIG.TRACK_LENGTH/2 + 15), 0, 0);
        scene.add(group);
    }

    // ==================== 站台与轨道创建 ====================
    function createPlatformAndTrack(platformId) {
        const group = new THREE.Group();
        const zPos = (platformId - 1) * CONFIG.PLATFORM_SPACING - (CONFIG.PLATFORM_SPACING * 3.5) + 2;

        // ===== 站台主体 =====
        const platGroup = new THREE.Group();

        // 站台底座
        const baseGeo = new THREE.BoxGeometry(CONFIG.TRACK_LENGTH, 1.2, 9);
        const baseMat = new THREE.MeshLambertMaterial({ color: 0x95A5A6 });
        const base = new THREE.Mesh(baseGeo, baseMat);
        base.position.y = 0.6;
        base.castShadow = true;
        base.receiveShadow = true;
        platGroup.add(base);

        // 站台顶棚支撑柱
        const pillarGeo = new THREE.BoxGeometry(0.6, 4, 0.6);
        const pillarMat = new THREE.MeshLambertMaterial({ color: 0x7F8C8D });
        for (let x = -(CONFIG.TRACK_LENGTH/2 - 5); x <= (CONFIG.TRACTK_LENGTH/2 - 5); x += 15) {
            const pillar = new THREE.Mesh(pillarGeo, pillarMat);
            pillar.position.set(x, 3.2, 0);
            pillar.castShadow = true;
            platGroup.add(pillar);
        }

        // 站台顶棚
        const roofGeo = new THREE.BoxGeometry(CONFIG.TRACTK_LENGTH + 2, 0.4, 11);
        const roofMat = new THREE.MeshLambertMaterial({ 
            color: 0xBDC3C7,
            transparent: true,
            opacity: 0.9
        });
        const roof = new THREE.Mesh(roofGeo, roofMat);
        roof.position.y = 5.4;
        roof.castShadow = true;
        platGroup.add(roof);

        // 安全黄线
        const lineGeo = new THREE.BoxGeometry(CONFIG.TRACTK_LENGTH - 2, 0.08, 0.4);
        const lineMat = new THREE.MeshBasicMaterial({ color: 0xF39C12 });
        const safetyLine = new THREE.Mesh(lineGeo, lineMat);
        safetyLine.position.set(0, 1.21, 4);
        platGroup.add(safetyLine);

        // 站名牌
        const signGeo = new THREE.BoxGeometry(6, 1.8, 0.2);
        const signMat = new THREE.MeshLambertMaterial({ color: 0xECF0F1 });
        const sign = new THREE.Mesh(signGeo, signMat);
        sign.position.set(CONFIG.TRACTK_LENGTH/2 - 6, 4, 5.2);
        platGroup.add(sign);

        // 站台编号文字（使用Canvas纹理）
        const canvas = document.createElement('canvas');
        canvas.width = 128;
        canvas.height = 64;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#1a1a2e';
        ctx.fillRect(0, 0, 128, 64);
        ctx.fillStyle = '#F1C40F';
        ctx.font = 'bold 36px Arial';
        ctx.textAlign = 'center';
        ctx.fillText(`${platformId}号`, 64, 44);
        const texture = new THREE.CanvasTexture(canvas);
        const signTextGeo = new THREE.PlaneGeometry(5, 2.5);
        const signTextMat = new THREE.MeshBasicMaterial({ map: texture, transparent: true });
        const signText = new THREE.Mesh(signTextGeo, signTextMat);
        signText.position.set(CONFIG.TRACTK_LENGTH/2 - 6, 4, 5.35);
        platGroup.add(signText);

        platGroup.position.z = zPos;
        group.add(platGroup);
        GameState.platformMeshes[platformId] = platGroup;

        // ===== 轨道 =====
        const trackGroup = new THREE.Group();

        // 轨道床
        const bedGeo = new THREE.BoxGeometry(CONFIG.TRACTK_LENGTH, 0.3, 3);
        const bedMat = new THREE.MeshLambertMaterial({ color: 0x8B7355 });
        const bed = new THREE.Mesh(bedGeo, bedMat);
        bed.position.set(0, 0.15, -6);
        trackGroup.add(bed);

        // 铁轨（两条）
        const railGeo = new THREE.BoxGeometry(CONFIG.TRACTK_LENGTH, 0.1, 0.15);
        const railMat = new THREE.MeshLambertMaterial({ color: 0x666666 });
        const rail1 = new THREE.Mesh(railGeo, railMat);
        rail1.position.set(0, 0.38, -6.6);
        trackGroup.add(rail1);
        const rail2 = new THREE.Mesh(railGeo, railMat);
        rail2.position.set(0, 0.38, -5.4);
        trackGroup.add(rail2);

        // 枕木
        const sleeperGeo = new THREE.BoxGeometry(0.3, 0.15, 2.8);
        const sleeperMat = new THREE.MeshLambertMaterial({ color: 0x5D4037 });
        for (let x = -(CONFIG.TRACTK_LENGTH/2 - 2); x <= (CONFIG.TRACTK_LENGTH/2 - 2); x += 2) {
            const sleeper = new THREE.Mesh(sleeperGeo, sleeperMat);
            sleeper.position.set(x, 0.32, -6);
            trackGroup.add(sleeper);
        }

        trackGroup.position.z = zPos;
        group.add(trackGroup);
        GameState.trackMeshes[platformId] = trackGroup;

        scene.add(group);
    }

    // ==================== 列车创建 ====================
    function createTrainMesh(trainData) {
        const group = new THREE.Group();
        const trainType = TRAIN_TYPES.find(t => t.type === trainData.type);
        const carCount = trainType.carCount;

        // 车头（流线型锥体）
        const noseGeo = new THREE.ConeGeometry(1.8, 5, 8);
        noseGeo.rotateZ(-Math.PI / 2);
        const noseMat = new THREE.MeshPhongMaterial({ 
            color: trainType.color, 
            shininess: 80 
        });
        const nose = new THREE.Mesh(noseGeo, noseMat);
        nose.position.set(carCount * 4 + 2.5, 1.8, 0);
        nose.castShadow = true;
        group.add(nose);

        // 车厢
        const carGeo = new THREE.BoxGeometry(8, 3.2, 2.8);
        const carMat = new THREE.MeshPhongMaterial({ 
            color: trainType.color, 
            shininess: 60 
        });

        for (let i = 0; i < carCount; i++) {
            const car = new THREE.Mesh(carGeo, carMat);
            car.position.set(-i * 8.5 - 4, 1.6, 0);
            car.castShadow = true;
            group.add(car);

            // 车窗
            const windowGeo = new THREE.BoxGeometry(7, 1.3, 0.1);
            const windowMat = new THREE.MeshBasicMaterial({ 
                color: 0xAED6F1, 
                transparent: true, 
                opacity: 0.65 
            });
            const window_ = new THREE.Mesh(windowGeo, windowMat);
            window_.position.set(-i * 8.5 - 4, 2.4, 1.45);
            group.add(window_);
        }

        // 初始位置（从右侧进入）
        group.position.set(80, 0, trainData.targetZ);
        
        return group;
    }

    // ==================== 核心功能：建造站台 ====================
    function buildPlatform(platformId) {
        // 检查是否已建造
        if (GameState.builtPlatforms.includes(platformId)) {
            showNotification(`${platformId}号站台已经存在`, 'info');
            return false;
        }

        // 检查是否按顺序建造（必须先建前面的）
        if (GameState.builtPlatforms.length > 0) {
            const lastBuilt = GameState.builtPlatforms[GameState.builtPlatforms.length - 1];
            if (platformId !== lastBuilt + 1) {
                showNotification(`请先建造 ${lastBuilt + 1}号站台`, 'warning');
                return false;
            }
        }

        // 第一个站台免费，后续需要检查资金（这里简化为全部免费）
        // 显示站台和轨道
        if (GameState.platformMeshes[platformId]) {
            GameState.platformMeshes[platformId].visible = true;
        }
        if (GameState.trackMeshes[platformId]) {
            GameState.trackMeshes[platformId].visible = true;
        }

        // 记录
        GameState.builtPlatforms.push(platformId);
        
        // 更新UI
        updateBuildPanel();
        updateDataPanel();
        checkStageProgress();

        // 特效提示
        const typeName = ['普速','快速','动车','高铁'][Math.floor(Math.random()*4)];
        showNotification(`✅ ${platformId}号站台建造完成！轨道已自动接入`, 'success');

        // 如果是第一个站台，添加初始列车并开始游戏
        if (!GameState.hasBuiltFirstPlatform) {
            GameState.hasBuiltFirstPlatform = true;
            GameState.tutorialComplete = true;
            GameState.paused = false;
            
            // 自动添加3列初始列车
            setTimeout(() => addAutoTrain(), 500);
            setTimeout(() => addAutoTrain(), 1500);
            setTimeout(() => addAutoTrain(), 2500);
            
            showNotification('🎉 车站开始运营！火车会自动进出站', 'success');
            updatePauseButton();
        } else {
            // 新站台也自动加一列车
            setTimeout(() => addAutoTrain(), 800);
        }

        return true;
    }

    // ==================== 核心功能：自动添加列车 ====================
    function addAutoTrain() {
        if (GameState.trains.length >= CONFIG.MAX_TRAINS) {
            showNotification('已达到最大列车数量', 'warning');
            return;
        }

        if (GameState.builtPlatforms.length === 0) {
            showNotification('请先建造至少一个站台', 'warning');
            return;
        }

        // 随机选择车型（根据阶段调整概率）
        let typeIndex;
        const rand = Math.random();
        if (GameState.currentStage <= 2) {
            typeIndex = rand < 0.6 ? 0 : (rand < 0.9 ? 1 : 2);  // 多普速/快速
        } else if (GameState.currentStage <= 4) {
            typeIndex = rand < 0.3 ? 0 : (rand < 0.6 ? 1 : (rand < 0.85 ? 2 : 3));
        } else {
            typeIndex = rand < 0.15 ? 0 : (rand < 0.35 ? 1 : (rand < 0.65 ? 2 : 3));  // 多高铁
        }
        const trainType = TRAIN_TYPES[typeIndex];

        // 选择目标站台（随机选择已建的站台）
        const targetPlatform = GameState.builtPlatforms[
            Math.floor(Math.random() * GameState.builtPlatforms.length)
        ];
        const targetZ = (targetPlatform - 1) * CONFIG.PLATFORM_SPACING - (CONFIG.PLATFORM_SPACING * 3.5) + 2;

        // 创建列车数据
        const trainData = {
            id: GameState.nextTrainId++,
            type: trainType.type,
            name: `${trainType.name} #${String(GameState.nextTrainId-1).padStart(3,'0')}`,
            targetZ: targetZ,
            targetPlatform: targetPlatform,
            state: 'approaching',     // approaching -> stopped -> departing -> gone
            progress: 0,               // 0到1的进度
            arrivalTime: null,
            departTime: null,
            stopDuration: 2 + Math.random() * 3,  // 停靠2-5分钟
            mesh: null
        };

        // 创建3D模型
        trainData.mesh = createTrainMesh(trainData);
        scene.add(trainData.mesh);
        GameState.trainMeshes[trainData.id] = trainData.mesh;

        // 加入列表
        GameState.trains.push(trainData);

        // 更新UI
        updateDataPanel();

        showNotification(`🚂 ${trainData.name} 已加入运营 → ${targetPlatform}号站台`, 'info');
    }

    // ==================== 列车位置更新（全自动） ====================
    function updateTrains(deltaTime) {
        const trainsToRemove = [];

        GameState.trains.forEach(train => {
            if (!train.mesh) return;

            const speed = 0.015 * TRAIN_TYPES.find(t=>t.type===train.type).speed;

            switch (train.state) {
                case 'approaching':
                    // 从右向左进站
                    train.progress += speed * deltaTime * 60;
                    train.mesh.position.x = lerp(80, 0, clamp(train.progress, 0, 1));

                    if (train.progress >= 1) {
                        train.state = 'stopped';
                        train.arrivalTime = GameState.timeMinutes;
                        train.departTime = GameState.timeMinutes + train.stopDuration;
                        
                        // 到站提示
                        showNotification(`📍 ${train.name} 抵达${train.targetPlatform}号站台`, 'info');
                    }
                    break;

                case 'stopped':
                    // 停靠中（轻微晃动效果）
                    train.mesh.position.x = 0 + Math.sin(Date.now() * 0.002) * 0.05;
                    
                    // 检查是否该发车了
                    if (GameState.timeMinutes >= train.departTime) {
                        train.state = 'departing';
                        train.progress = 0;
                    }
                    break;

                case 'departing':
                    // 向左离开
                    train.progress += speed * deltaTime * 60;
                    train.mesh.position.x = lerp(0, -80, clamp(train.progress, 0, 1));

                    if (train.progress >= 1) {
                        train.state = 'gone';
                        trainsToRemove.push(train.id);
                    }
                    break;
            }
        });

        // 移除离开的列车
        trainsToRemove.forEach(id => {
            const idx = GameState.trains.findIndex(t => t.id === id);
            if (idx !== -1) {
                const train = GameState.trains[idx];
                if (train.mesh) {
                    scene.remove(train.mesh);
                    delete GameState.trainMeshes[id];
                }
                GameState.trains.splice(idx, 1);
                
                // 补充新列车（保持运营密度）
                if (GameState.tutorialComplete && GameState.trains.length < Math.min(GameState.builtPlatforms.length * 2, CONFIG.MAX_TRAINS)) {
                    setTimeout(() => addAutoTrain(), randomInt(2000, 6000));
                }
            }
        });
    }

    function lerp(a, b, t) {
        return a + (b - a) * t;
    }

    // ==================== 收入计算（极简版） ====================
    function calculateIncome() {
        const platformCount = GameState.builtPlatforms.length;
        const trainCount = GameState.trains.filter(t => t.state === 'stopped' || t.state === 'departing').length;
        
        // 基础收入 = 站台数 × 基础费率 + 运营列车数 × 列车费率
        const baseIncome = platformCount * CONFIG.INCOME_PER_PLATFORM;
        const trainBonus = trainCount * CONFIG.INCOME_PER_TRAIN;
        
        // 日间加成
        const hour = Math.floor(GameState.timeMinutes % 1440 / 60);
        const dayBonus = (hour >= 6 && hour < 20) ? 1.3 : 0.6;
        
        const totalIncome = (baseIncome + trainBonus) * dayBonus;
        
        return totalIncome;
    }

    // ==================== 阶段检查 ====================
    function checkStageProgress() {
        const platformCount = GameState.builtPlatforms.length;
        
        // 找到当前应该处于的阶段
        for (let i = STAGE_REQUIREMENTS.length - 1; i >= 0; i--) {
            const req = STAGE_REQUIREMENTS[i];
            if (platformCount >= req.unlockPlatforms) {
                if (GameState.currentStage !== i + 1) {
                    GameState.currentStage = i + 1;
                    showNotification(`🎊 升级到【${req.name}】！当前已有${platformCount}个站台`, 'success');
                }
                break;
            }
        }

        // 更新UI
        const currentReq = STAGE_REQUIREMENTS[GameState.currentStage - 1];
        const nextReq = STAGE_REQUIREMENTS[GameState.currentStage];
        
        document.getElementById('stage-text').textContent = `阶段 ${GameState.currentStage}/5 — ${currentReq.name}`;
        
        if (nextReq) {
            document.getElementById('next-stage-hint').textContent = `下一阶段: ${nextReq.unlockPlatforms}个站台`;
            
            // 进度条
            const progress = ((platformCount - currentReq.unlockPlatforms) / (nextReq.unlockPlatforms - currentReq.unlockPlatforms)) * 100;
            document.getElementById('stage-progress').style.width = `${clamp(progress, 0, 100)}%`;
        } else {
            document.getElementById('next-stage-hint').textContent = '🏆 已达到最高阶段！';
            document.getElementById('stage-progress').style.width = '100%';
            
            // 终极目标达成检查
            if (platformCount >= 8) {
                showNotification('🎉🎉🎉 恭喜！你建成了一座超级火车站！🏆', 'success');
            }
        }
    }

    // ==================== UI更新函数 ====================
    function updateDataPanel() {
        document.getElementById('val-money').textContent = formatMoney(GameState.money);
        document.getElementById('val-trains').textContent = `${GameState.trains.length} 列`;
        document.getElementById('val-platforms').textContent = `${GameState.builtPlatforms.length} / ${CONFIG.MAX_PLATFORMS}`;
        
        // 数字闪烁动画
        flashValue('val-money');
    }

    function flashValue(elementId) {
        const el = document.getElementById(elementId);
        el.style.transform = 'scale(1.15)';
        setTimeout(() => el.style.transform = 'scale(1)', 200);
    }

    function updateTimeDisplay() {
        document.getElementById('time-display').textContent = minutesToHHMM(GameState.timeMinutes);
        document.getElementById('day-display').textContent = `第${GameState.day}天`;
    }

    function updateBuildPanel() {
        const container = document.getElementById('platform-buttons');
        container.innerHTML = '';

        for (let i = 1; i <= CONFIG.MAX_PLATFORMS; i++) {
            const isBuilt = GameState.builtPlatforms.includes(i);
            const canBuild = i === 1 || (GameState.builtPlatforms.includes(i - 1));
            const isNext = canBuild && !isBuilt;

            const btn = document.createElement('button');
            btn.className = `build-btn ${isBuilt ? '' : (!canBuild ? 'locked' : '')} ${isNext && !isBuilt ? 'free highlight-pulse' : ''}`;
            btn.disabled = isBuilt || !canBuild;
            
            if (isBuilt) {
                btn.innerHTML = `
                    <span class="build-btn-name">✅ ${i}号站台</span>
                    <span class="build-btn-cost" style="color:#27AE60;">已启用</span>
                `;
            } else if (canBuild) {
                btn.innerHTML = `
                    <span class="build-btn-name">🔨 ${i}号站台</span>
                    <span class="build-btn-cost">免费建造</span>
                `;
                btn.onclick = () => buildPlatform(i);
            } else {
                btn.innerHTML = `
                    <span class="build-btn-name">🔒 ${i}号站台</span>
                    <span class="build-btn-cost">需先建${i-1}号</span>
                `;
            }

            container.appendChild(btn);
        }
    }

    function updatePauseButton() {
        const btn = document.getElementById('pause-btn');
        btn.textContent = GameState.paused ? '▶ 继续' : '⏸ 暂停';
    }

    // ==================== 控制函数 ====================
    function setSpeed(speed) {
        GameState.speedMultiplier = speed;
        document.querySelectorAll('.speed-btn').forEach((btn, idx) => {
            btn.classList.toggle('active', idx === Math.log2(speed));
        });
    }

    function togglePause() {
        if (!GameState.tutorialComplete && !GameState.hasBuiltFirstPlatform) {
            showNotification('请先建造第一个站台', 'info');
            return;
        }
        GameState.paused = !GameState.paused;
        updatePauseButton();
    }

    // ==================== 相机控制 ====================
    function initOrbitControls() {
        const canvas = renderer.domElement;

        canvas.addEventListener('mousedown', (e) => {
            if (e.button === 2) {  // 右键
                isDragging = true;
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
            }
        });

        canvas.addEventListener('mousemove', (e) => {
            if (isDragging) {
                const deltaX = e.clientX - lastMouseX;
                const deltaY = e.clientY - lastMouseY;
                
                cameraTheta -= deltaX * 0.01;
                cameraPhi = clamp(cameraPhi + deltaY * 0.01, 0.2, Math.PI / 2 - 0.1);
                
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
                updateCameraPosition();
            }
        });

        canvas.addEventListener('mouseup', () => isDragging = false);
        canvas.addEventListener('mouseleave', () => isDragging = false);

        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            const delta = e.deltaY > 0 ? 1.12 : 0.89;
            cameraDistance = clamp(cameraDistance * delta, 40, 280);
            updateCameraPosition();
        }, { passive: false });

        // 键盘控制
        document.addEventListener('keydown', (e) => {
            const moveSpeed = 3;
            switch(e.key.toLowerCase()) {
                case 'w': cameraTarget.z -= moveSpeed; break;
                case 's': cameraTarget.z += moveSpeed; break;
                case 'a': cameraTarget.x -= moveSpeed; break;
                case 'd': cameraTarget.x += moveSpeed; break;
                case ' ': togglePause(); break;
                case '1': setSpeed(1); break;
                case '2': setSpeed(2); break;
                case '3': setSpeed(4); break;
            }
            updateCameraPosition();
        });
    }

    function updateCameraPosition() {
        const offset = new THREE.Vector3(
            Math.sin(cameraPhi) * Math.cos(cameraTheta),
            Math.cos(cameraPhi),
            Math.sin(cameraPhi) * Math.sin(cameraTheta)
        );
        
        camera.position.copy(cameraTarget).add(offset.multiplyScalar(cameraDistance));
        camera.lookAt(cameraTarget);
        
        // 更新正交相机范围
        const aspect = window.innerWidth / window.innerHeight;
        const viewSize = cameraDistance * 0.67;
        camera.left = -viewSize * aspect;
        camera.right = viewSize * aspect;
        camera.top = viewSize;
        camera.bottom = -viewSize;
        camera.updateProjectionMatrix();
    }

    function onWindowResize() {
        const aspect = window.innerWidth / window.innerHeight;
        const viewSize = cameraDistance * 0.67;
        camera.left = -viewSize * aspect;
        camera.right = viewSize * aspect;
        camera.top = viewSize;
        camera.bottom = -viewSize;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // ==================== 新手引导 ====================
    function showTutorial() {
        const overlay = document.createElement('div');
        overlay.className = 'tutorial-overlay';
        overlay.id = 'tutorial-overlay';
        overlay.innerHTML = `
            <div class="tutorial-box">
                <div class="tutorial-title">🚂 欢迎来到火车站建造者！</div>
                <div class="tutorial-subtitle">从这里开始，建造属于你的超级车站</div>
                
                <div class="tutorial-step">
                    <div class="tutorial-step-title">📋 第一步：建造第一个站台</div>
                    <div class="tutorial-step-desc">
                        点击左侧闪烁的绿色按钮<br>
                        <strong>"🔨 1号站台 - 免费建造"</strong><br><br>
                        ✅ 站台会立刻出现<br>
                        ✅ 轨道会自动接入<br>
                        ✅ 完全免费！
                    </div>
                </div>
                
                <div class="tutorial-step" style="background:rgba(52,152,219,0.15);border-color:rgba(52,152,219,0.3);">
                    <div class="tutorial-step-title" style="color:#3498DB;">🚂 第二步：观看火车运行</div>
                    <div class="tutorial-step-desc">
                        建好站台后，火车会<strong>自动</strong>：<br>
                        • 自动进站停靠<br>
                        • 自动上下客<br>
                        • 自动出发离开<br><br>
                        你只需要享受建造的乐趣！💰
                    </div>
                </div>
                
                <button class="tutorial-btn" onclick="closeTutorial()">👍 明白了！开始建造</button>
            </div>
        `;
        document.body.appendChild(overlay);
    }

    function closeTutorial() {
        const overlay = document.getElementById('tutorial-overlay');
        if (overlay) overlay.remove();
    }

    // ==================== 主循环 ====================
    function gameLoop() {
        requestAnimationFrame(gameLoop);
        const delta = clock.getDelta();

        // 只有在非暂停且引导完成后才更新
        if (!GameState.paused && GameState.tutorialComplete) {
            // 更新时间
            GameState.timeMinutes += delta * CONFIG.TIME_SCALE * GameState.speedMultiplier;
            
            // 天数进位
            while (GameState.timeMinutes >= 1440) {
                GameState.timeMinutes -= 1440;
                GameState.day++;
            }

            // 更新列车位置
            updateTrains(delta);

            // 计算收入（每帧累加小量）
            const incomePerFrame = calculateIncome() * delta * GameState.speedMultiplier / 60;
            GameState.money += incomePerFrame;
            GameState.totalIncome += Math.abs(incomePerFrame);

            // 更新UI（节流）
            if (Math.floor(GameState.timeMinutes) % 1 === 0) {
                updateTimeDisplay();
            }
        }

        // 渲染
        renderer.render(scene, camera);
    }

    // ==================== 初始化 ====================
    function init() {
        initScene();
        updateBuildPanel();
        updateDataPanel();
        updateTimeDisplay();
        gameLoop();
        
        // 显示新手引导
        setTimeout(showTutorial, 500);
    }

    // 启动
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }

    // 暴露全局函数供HTML调用
    window.buildPlatform = buildPlatform;
    window.addAutoTrain = addAutoTrain;
    window.setSpeed = setSpeed;
    window.togglePause = togglePause;
